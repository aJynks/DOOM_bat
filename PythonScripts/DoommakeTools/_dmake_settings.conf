# ==============================================================================
# _dmake_settings.conf
# ------------------------------------------------------------------------------
# Shared editable settings for the dmake tool suite:
#   dmake_script.py       (dmake)     - iwads, hack_types, clean_strip_sets,
#                                       defaults.create_*
#   doom_script.py        (doom)      - source_ports, iwads, paks,
#                                       defaults.run_*
#   doommake-tweak-script.py (doommake-tweak) - tweak.*
#
# Lives on PATH next to the scripts. Edit here; every tool picks it up.
#
# Format: JSON, but full-line comments starting with # or // are allowed
# (they are stripped before parsing). NOTE: JSON rules still apply to the
# data itself - backslashes in paths must be doubled (\\), no trailing
# commas, and no comments at the end of a data line.
# ==============================================================================

{
    // --------------------------------------------------------------------------
    // IWADs: keyword -> path   (used by: dmake, doom)
    // --------------------------------------------------------------------------
    "iwads": {
        "doom":     "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\doom.wad",
        "doom2":    "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\doom2.wad",
        "tnt":      "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\tnt.wad",
        "plutonia": "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\plutonia.wad",
        "heretic":  "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\heretic.wad",
        "hexen":    "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\hexen.wad",
        "free1":    "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\freedoom1.wad",
        "free2":    "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\freedoom2.wad",
		"doom94":   "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\doom_1993.wad",
		"doom294":  "D:\\Projects\\DoomProjects\\_SourcePorts\\_iwads\\doom2_1994.wad"
    },

    // --------------------------------------------------------------------------
    // Source ports: keyword -> exe path   (used by: doom)
    // --------------------------------------------------------------------------
    "source_ports": {
        "cherry": "D:\\Projects\\DoomProjects\\_SourcePorts\\Cherry-Doom\\cherry-doom.exe",
        "choco":  "D:\\Projects\\DoomProjects\\_SourcePorts\\Chocolate-Doom\\chocolate-doom.exe",
        "crispy": "D:\\Projects\\DoomProjects\\_SourcePorts\\Crispy-Doom\\crispy-doom.exe",
        "dsda":   "D:\\Projects\\DoomProjects\\_SourcePorts\\dsda-Doom\\dsda-doom.exe",
        "crl":    "D:\\Projects\\DoomProjects\\_SourcePorts\\CRL\\crl-doom.exe",
        "helion": "D:\\Projects\\DoomProjects\\_SourcePorts\\Helion-Doom\\Helion.exe",
        "kex":    "D:\\Projects\\DoomProjects\\_SourcePorts\\Kex-Doom\\DOOM + DOOM II\\doom_gog.exe",
        "nugget": "D:\\Projects\\DoomProjects\\_SourcePorts\\Nugget-Doom\\nugget-doom.exe",
        "nyan":   "D:\\Projects\\DoomProjects\\_SourcePorts\\Nyan-Doom\\nyan-doom.exe",
        "retro":  "D:\\Projects\\DoomProjects\\_SourcePorts\\Reto-Doom\\doomretro.exe",
        "uz":     "D:\\Projects\\DoomProjects\\_SourcePorts\\uzDoom\\uzdoom.exe",
        "woof":   "D:\\Projects\\DoomProjects\\_SourcePorts\\Woof-Doom\\woof.exe"
    },

    // --------------------------------------------------------------------------
    // Paks: name -> list of WAD paths   (used by: doom)
    // Loaded BEFORE folder-selected WAD / project release WAD.
    // --------------------------------------------------------------------------
    "paks": {
        "pak1": [
            "D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\NyanDoom\\aJynks-NyanHud-Full.wad",
            "D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\All Ports\\StatusBars\\statusBar-GFXonly-Glasses.wad"
        ],
        "pak2": [
            "D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\NyanDoom\\Kat-NyanHud-Full.wad",
            "D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\All Ports\\StatusBars\\statusBar-GFXonly-Helmet.wad"
        ],
        "origGuns": [
            "D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\All Ports\\Sounds\\Doom2_Original_Weapon_Sounds\\Doom2-Original_Sound-All_Weapons.wad",
			"D:\\Projects\\DoomProjects\\_SourcePorts\\_Wads and Mods\\_tweaks\\All Ports\\Sounds\\Plasma.Blast_alternativeSound\\aJynks_plasma.wad"
        ]
    },

    // --------------------------------------------------------------------------
    // DECOHack patch types   (used by: dmake create)
    // --------------------------------------------------------------------------
    "hack_types": [
        "doom19", "udoom19", "doomunity", "boom", "mbf",
        "extended", "mbf21", "dsdhacked", "id24"
    ],

    // --------------------------------------------------------------------------
    // Clean strip sets: flag -> lump names   (used by: dmake clean)
    // --texturex / --anims / --deco / --clean
    // --------------------------------------------------------------------------
    "clean_strip_sets": {
        "texturex": ["TEXTURE1", "TEXTURE2", "PNAMES"],
        "anims":    ["ANIMATED", "SWITCHES"],
        "deco":     ["DEHACKED", "DECOHACK"],
		"info":     ["__VER__", "WADINFO", "CREDITS", COMPLVL", "UMAPINFO"],
        "clean": [
            "DEHACKED", "DECOHACK", "TEXTURE1", "TEXTURE2", "PNAMES",
            "ANIMATED", "SWITCHES", "CREDITS", "WADINFO", "COMPLVL",
            "UMAPINFO", "__VER__"
        ],
        "texture1": ["TEXTURE1"],
        "texture2": ["TEXTURE2"]
    },

    // --------------------------------------------------------------------------
    // Defaults
    //   create_* used by: dmake create        run_* used by: doom
    // --------------------------------------------------------------------------
    "defaults": {
        "create_name":      "megawad",
        "create_directory": "./_DT_Projects/_Current",
        "create_iwad":      "doom2",
        "create_hacktype":  "dsdhacked",
        "run_port":         "nyan",
        "run_iwad":         "doom2"
    },

    // --------------------------------------------------------------------------
    // doommake-tweak settings   (used by: doommake-tweak)
    //   file_templates : templates copied into a fresh project
    //                    (source files resolved next to doommake-tweak.ps1)
    //   entry_deletions: stock entry targets deleted from doommake.script
    //   append_blocks  : conf blocks appended to the end of doommake.script,
    //                    in listed order
    // --------------------------------------------------------------------------
    "tweak": {
        "file_templates": [
            { "source_file": "doommake-tweak-FILE_credits.txt",       					   "dest_path": ".\\src",                  "prefix": "FILE_" },
            { "source_file": "doommake-tweak-FILE_COMPLVL.txt",        					   "dest_path": ".\\src\\assets\\_global", "prefix": "FILE_" },
            { "source_file": "doommake-tweak-FILE_UMAPINFO.txt",      					   "dest_path": ".\\src\\assets\\_global", "prefix": "FILE_" },
            { "source_file": "doommake-tweak-FILE_doom1-playpal.cube",					   "dest_path": ".\\",                     "prefix": "FILE_" },
            { "source_file": "doommake-tweak-DECO_main.dh",           					   "dest_path": ".\\src\\decohack",        "prefix": "DECO_" },
            { "source_file": "doommake-tweak-DECO_strings.dh",        					   "dest_path": ".\\src\\decohack",        "prefix": "DECO_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-doDehWad.txt",                 "dest_path": ".\\scripts",              "prefix": "WADMERGE_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-editorrelease.txt",            "dest_path": ".\\scripts", 			   "prefix": "WADMERGE_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-editorrelease-map99.txt",      "dest_path": ".\\scripts", 			   "prefix": "WADMERGE_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-texturesrelease.txt",          "dest_path": ".\\scripts", 			   "prefix": "WADMERGE_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-palette.txt",                  "dest_path": ".\\scripts", 			   "prefix": "WADMERGE_" },
            { "source_file": "doommake-tweak-WADMERGE_merge-editorreleasenotexturex.txt",  "dest_path": ".\\scripts", 			   "prefix": "WADMERGE_" }
        ],
        "entry_deletions": [
            "make",
            "release"
        ],
        "append_blocks": [
            "doommake-tweak_FUNC-MAKE-TARGETS_all.conf",
            "doommake-tweak_FUNC-MAKE-TARGETS_final.conf",
            "doommake-tweak_FUNC-REPLACE_make.conf",
            "doommake-tweak_FUNC-REPLACE_release.conf"
        ]
    }
}
