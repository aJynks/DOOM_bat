/****************************************************************************
 * TARGET: deco
 ****************************************************************************
 * Creates a WAD containing only the DEHACKED lump.
 * doommake deco
 ****************************************************************************/
/* -- functions -- */
check function doDehWad() {

    initBuild();

    outWad = getBuildDirectory() + "/dehacked.wad";
    sourceDir = getSourceDirectory() + SRC_DECOHACK;
    verifydirs(sourceDir);

    if (checkFileExistenceAndBuildStatuses(outWad, ["dehacked"])) {
        hash = directoryHasChanged(sourceDir);
        if (hash === null) {
            println("[Skipped] DEH-only WAD up to date.");
            return;
        }
    } else {
        hash = getDirectoryHash(sourceDir);
    }

    println("Building DEH-only WAD: " + outWad);

    wadmerge(file("scripts/merge-doDehWad.txt"), [
        getBuildDirectory(),
        getSourceDirectory()
    ]);

    storeDirectoryChanged(sourceDir, hash);
    setBuilt("dehonly");
}

/* -- build target -- */
check entry deco(args) {
    doPatch(true);
    doDehWad();
}

/****************************************************************************
 * TARGET: editorrelease
 ****************************************************************************
 * Same result as `release`, but uses ALL textures (not just those used in
 * maps) and includes only MAP99, if present - never the full maps.wad.
 * doommake editorrelease
 ****************************************************************************/
/* -- functions -- */
check function doEditorRelease() {

    initBuild();

    outWad = getBuildDirectory() + "/editor-assets-release.wad";
    map99Source = getSourceDirectory() + "/maps/MAP99.wad";

    println("Building editor release WAD: " + outWad);

    if (fileexists(map99Source)) {
        wadmerge(file("scripts/merge-editorrelease-map99.txt"), [
            getBuildDirectory(),
            getSourceDirectory(),
            "editor-assets-release.wad",
            map99Source
        ]);
    } else {
        wadmerge(file("scripts/merge-editorrelease.txt"), [
            getBuildDirectory(),
            getSourceDirectory(),
            "editor-assets-release.wad"
        ]);
    }

    setBuilt("editorrelease");
}

/* -- build target -- */
check entry editorrelease(args) {
    doInit();
    doAll();
    doEditorRelease();
}

/****************************************************************************
 * TARGET: texturesrelease
 ****************************************************************************
