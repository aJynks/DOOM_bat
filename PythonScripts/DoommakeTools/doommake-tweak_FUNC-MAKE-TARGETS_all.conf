/****************************************************************************
 * TARGET: editorreleasenotexturex
 ****************************************************************************
 * Same as `editorrelease`, but with no TEXTURE1, TEXTURE2, PNAMES,
 * ANIMATED, or SWITCHES lumps in the output WAD. All texture graphics
 * (flats, patches, single-patch textures) are still included.
 * No MAP99 check — maps are never included in this target.
 * doommake editorreleasenotexturex
 ****************************************************************************/
/* -- functions -- */
check function deleteEntryIfExists(wad, name) {
    idx = wadentryindex(wad, name);
    if (idx !== null) {
        waddelete(wad, idx);
        println("[Strip] Removed lump: " + name);
    }
}

check function doEditorReleaseNoTexturex() {

    initBuild();

    outWad = getBuildDirectory() + "/editor-assets-release-notexturex.wad";

    println("Building editor release WAD (no texturex): " + outWad);

    wadmerge(file("scripts/merge-editorreleasenotexturex.txt"), [
        getBuildDirectory(),
        getSourceDirectory(),
        "editor-assets-release-notexturex.wad"
    ]);

    // Strip definition lumps written by mergetexturedir and mergeswantbls.
    // Re-query by name after each delete so index shifts don't matter.
    wad = wadfile(outWad);
    deleteEntryIfExists(wad, "TEXTURE1");
    deleteEntryIfExists(wad, "TEXTURE2");
    deleteEntryIfExists(wad, "PNAMES");
    deleteEntryIfExists(wad, "ANIMATED");
    deleteEntryIfExists(wad, "SWITCHES");
    close(wad);

    setBuilt("editorreleasenotexturex");
}

/* -- build target -- */
check entry editorreleasenotexturex(args) {
    doInit();
    doAll();
    doEditorReleaseNoTexturex();
}

