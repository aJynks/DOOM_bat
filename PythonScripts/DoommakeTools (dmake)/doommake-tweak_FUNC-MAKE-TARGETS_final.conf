/* ===== doommake-TWEAK-MAKE-TARGETS-FINAL =================================== */
/****************************************************************************
 * TARGET: fresh
 ****************************************************************************
 * Cleans the build dir, then does a full build, release, dehacked-only WAD,
 * and palette WAD. Placed last since it calls doDehWad() and doPalette(),
 * which must be defined earlier in this file.
 * doommake fresh
 ****************************************************************************/
check entry fresh(args) {
    doClean();
    doInit();
    doAll();
    doRelease();
    doDehWad();
    doPalette();
	doEditorRelease();
}

/****************************************************************************
 * TARGET: complete
 ****************************************************************************
 * Runs release, editorrelease, texturesrelease, playpal, and deco - all in
 * one pass. No distribution zip.
 * doommake complete
 ****************************************************************************/
check entry complete(args) {
    doInit();
    doAll();
    doRelease();

    doEditorRelease();

    doConvertPalettes();
    doConvertColormaps();
    doConvertFlats();
    doConvertPatches();
    doConvertTextures();
    doTexturesRelease();

    doPalette();
    doDehWad(); // doPatch(true) called by doDehWad()
}

/****************************************************************************
 * TARGET: final
 ****************************************************************************
 * Same as `complete`, but also produces the distribution zip.
 * doommake final
 ****************************************************************************/
check entry final(args) {
    doInit();
    doAll();
    doRelease();

    doEditorRelease();

    doConvertPalettes();
    doConvertColormaps();
    doConvertFlats();
    doConvertPatches();
    doConvertTextures();
    doTexturesRelease();

    doPalette();

    doDehWad(); // doPatch(true) called by doDehWad()

    doDist();
}
