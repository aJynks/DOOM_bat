/****************************************************************************
 * TARGET: deco
 ****************************************************************************
 * Creates a WAD containing only the DEHACKED lump.
 * doommake deco
 ****************************************************************************/
/* -- functions -- */
check function doDehWad() {

    initBuild();

    outWad = getBuildDirectory() + "/dehacked.wad";
    sourceDir = getSourceDirectory() + SRC_DECOHACK;
    verifydirs(sourceDir);

    if (checkFileExistenceAndBuildStatuses(outWad, ["dehacked"])) {
        hash = directoryHasChanged(sourceDir);
        if (hash === null) {
            println("[Skipped] DEH-only WAD up to date.");
            return;
        }
    } else {
        hash = getDirectoryHash(sourceDir);
    }

    println("Building DEH-only WAD: " + outWad);

    wadmerge(file("scripts/merge-doDehWad.txt"), [
        getBuildDirectory(),
        getSourceDirectory()
    ]);

    storeDirectoryChanged(sourceDir, hash);
    setBuilt("dehonly");
}

/* -- build target -- */
check entry deco(args) {
    doPatch(false);
    doDehWad();
}

/****************************************************************************
 * TARGET: editorrelease
 ****************************************************************************
 * Same result as `release`, but uses ALL textures (not just those used in
 * maps) and includes only MAP99, if present - never the full maps.wad.
 * doommake editorrelease
 ****************************************************************************/
/* -- functions -- */
check function doEditorRelease() {

    initBuild();

    outWad = getBuildDirectory() + "/editor-assets-release.wad";
    map99Source = getSourceDirectory() + "/maps/MAP99.wad";

    println("Building editor release WAD: " + outWad);

    if (fileexists(map99Source)) {
        wadmerge(file("scripts/merge-editorrelease-map99.txt"), [
            getBuildDirectory(),
            getSourceDirectory(),
            "editor-assets-release.wad",
            map99Source
        ]);
    } else {
        wadmerge(file("scripts/merge-editorrelease.txt"), [
            getBuildDirectory(),
            getSourceDirectory(),
            "editor-assets-release.wad"
        ]);
    }

    setBuilt("editorrelease");
}

/* -- build target -- */
check entry editorrelease(args) {
    doInit();
    doAll();
    doEditorRelease();
}

/****************************************************************************
 * TARGET: texturesrelease
 ****************************************************************************
 * Identical to the standard texture build, but also includes wadinfo.txt
 * and credits.txt in the output WAD.
 * doommake texturesrelease
 ****************************************************************************/
/* -- functions -- */
check function doTexturesRelease() {

    initBuild();

    outWad = getBuildDirectory() + "/textures-release.wad";

    println("Building textures release WAD: " + outWad);

    wadmerge(file("scripts/merge-texturesrelease.txt"), [
        getBuildDirectory(),
        getSourceDirectory(),
        "textures-release.wad"
    ]);

    setBuilt("texturesrelease");
}

/* -- build target -- */
check entry texturesrelease(args) {
    doInit();
    doConvertPalettes();
    doConvertColormaps();
    doConvertFlats();
    doConvertPatches();
    doConvertTextures();
    doTexturesRelease();
}

/****************************************************************************
 * TARGET: playpal
 ****************************************************************************
 * Converts palettes and colormaps, then merges them into palette.wad.
 * This creates a WAD containing ONLY palette and colormap data.
 * doommake playpal
 ****************************************************************************/
/* -- functions -- */
check function doPalette() {

    initBuild();

    outWad = getBuildDirectory() + "/palette.wad";

    println("Building palette WAD: " + outWad);

    wadmerge(file("scripts/merge-palette.txt"), [
        getBuildDirectory(),
        getSourceDirectory(),
        "palette.wad"
    ]);

    setBuilt("palette");
}

/* -- build target -- */
check entry playpal(args) {
    doInit();
    doConvertPalettes();
    doConvertColormaps();
    doPalette();
}

/****************************************************************************
 * TARGET: fresh
 ****************************************************************************
 * Cleans the build dir, then does a full build, release, dehacked-only WAD,
 * and palette WAD. Placed last since it calls doDehWad() and doPalette(),
 * which must be defined earlier in this file.
 * doommake fresh
 ****************************************************************************/
check entry fresh(args) {
    doClean();
    doInit();
    doAll();
    doRelease();
    doDehWad();
    doPalette();
}

